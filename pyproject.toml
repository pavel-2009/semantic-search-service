[project]
name = "semantic-search-service"
version = "0.1.0"
description = "Semantic movie search service"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "pydantic>=2.13.4",
    "pydantic-settings>=2.15.0",
    "scrapy>=2.17.0",
    "text-cleaner @ file:///Users/pavel/ITWork/semantic-search-service/src/semantic_search_service/core/text_cleaner",
]

[project.scripts]
semantic-search-service = "semantic_search_service:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "nanobind>=2.15.0",
    "playwright>=1.62.0",
    "playwright-stealth>=2.0.3",
    "pyright>=1.1.411",
    "pytest>=9.1.1",
    "qdrant-client>=1.19.0",
    "ruff>=0.16.3",
    "scrapy-impersonate>=1.8.1",
    "scrapy-playwright>=0.0.48",
    "scrapy-user-agents>=0.1.1",
    "sentence-transformers>=6.0.0",
    "tenacity>=9.1.4",
    "uvicorn>=0.52.4",
]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "UP",
    "B",
    "SIM",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
