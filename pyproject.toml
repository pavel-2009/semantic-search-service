[project]
name = "semantic-search-service"
version = "0.1.0"
description = "Semantic movie search service powered by embeddings and Qdrant"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "aiogram>=3.22.0",
    "qdrant-client>=1.19.0",
    "scrapy>=2.17.0",
    "scrapy-playwright>=0.0.48",
    "sentence-transformers>=6.0.0",
    "fastapi>=0.141.1",
    "playwright>=1.62.0",
    "playwright-stealth>=2.0.3",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.15.0",
    "tenacity>=9.1.4",
    "uvicorn>=0.52.4",
]

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[tool.uv]
package = false

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "nanobind>=2.15.0",
    "pyright>=1.1.411",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "pytest-env>=1.7.0",
    "pytest-mock>=3.15.1",
    "pytest-timeout>=2.4.0",
    "pytest-xdist>=3.8.0",
    "requests>=2.34.2",
    "ruff>=0.16.3",
    "scrapy-impersonate>=1.8.1",
    "scrapy-user-agents>=0.1.1",
    "testcontainers>=4.15.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-v --strict-markers --tb=short"
markers = [
    "unit: Unit tests (fast, isolated)",
    "integration: Integration tests (require external services)",
    "e2e: End-to-end tests (full pipeline)",
    "performance: Performance and load tests",
    "slow: Tests that take a long time",
]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
