name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: latest
          python-version: "3.14"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --dev

      - name: Unit tests
        run: uv run pytest tests/unit -v

      - name: Integration tests
        run: uv run pytest tests/integration -v
