services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: semantic-qdrant
    ports:
      - "6333:6333"
    volumes:
      - qdrant_storage:/qdrant/storage
    environment:
      - QDRANT_API_KEY=${QDRANT_API_KEY:-}
    restart: unless-stopped
    networks:
      - semantic-network

  scraper:
    build:
      context: .
      dockerfile: Dockerfile.scraper
    container_name: semantic-scraper
    environment:
      - POISKKINO_API_KEY=${POISKKINO_API_KEY:-}
    volumes:
      - ./src:/app/src
      - ./src/scraper/data:/app/src/scraper/data
    depends_on:
      qdrant:
        condition: service_started
    restart: "no"
    networks:
      - semantic-network

  indexer:
    build:
      context: .
      dockerfile: Dockerfile.indexer
    container_name: semantic-indexer
    environment:
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
    volumes:
      - ./src:/app/src
      - ./src/scraper/data:/app/src/scraper/data
    depends_on:
      scraper:
        condition: service_completed_successfully
      qdrant:
        condition: service_started
    restart: "no"
    networks:
      - semantic-network

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: semantic-api
    command: uv run uvicorn backend.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    environment:
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - LOG_LEVEL=INFO
      - POISKKINO_API_KEY=${POISKKINO_API_KEY:-}
      - BOT_TOKEN=${BOT_TOKEN:-}
    volumes:
      - ./src:/app/src
    depends_on:
      indexer:
        condition: service_completed_successfully
      qdrant:
        condition: service_started
    restart: unless-stopped
    networks:
      - semantic-network

  bot:
    build:
      context: .
      dockerfile: Dockerfile.bot
    container_name: semantic-bot
    command: uv run python -m bot.main
    environment:
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - LOG_LEVEL=INFO
      - POISKKINO_API_KEY=${POISKKINO_API_KEY:-}
      - BOT_TOKEN=${BOT_TOKEN:-}
    volumes:
      - ./src:/app/src
    depends_on:
      api:
        condition: service_started
      qdrant:
        condition: service_started
    restart: unless-stopped
    networks:
      - semantic-network

volumes:
  qdrant_storage:

networks:
  semantic-network:
    driver: bridge
