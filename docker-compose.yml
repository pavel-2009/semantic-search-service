services:
  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "${QDRANT_PORT:-6333}:6333"
    volumes:
      - qdrant_storage:/qdrant/storage
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/health"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    networks:
      - semantic-network

  scraper:
    build:
      context: .
      dockerfile: Dockerfile.scraper
    environment:
      - POISKKINO_API_KEY=${POISKKINO_API_KEY:-}
    volumes:
      - ./src:/app/src
      - ./src/scraper/data:/app/src/scraper/data
    depends_on:
      qdrant:
        condition: service_healthy
    restart: "no"
    networks:
      - semantic-network

  indexer:
    build:
      context: .
      dockerfile: Dockerfile.indexer
    environment:
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
    volumes:
      - ./src:/app/src
      - ./src/scraper/data:/app/src/scraper/data
    depends_on:
      scraper:
        condition: service_completed_successfully
      qdrant:
        condition: service_healthy
    restart: "no"
    networks:
      - semantic-network

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    command: uv run uvicorn backend.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    environment:
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - LOG_LEVEL=INFO
      - POISKKINO_API_KEY=${POISKKINO_API_KEY:-}
      - BOT_TOKEN=${BOT_TOKEN:-}
    volumes:
      - ./src:/app/src
    depends_on:
      indexer:
        condition: service_completed_successfully
      qdrant:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    restart: unless-stopped
    networks:
      - semantic-network

  bot:
    build:
      context: .
      dockerfile: Dockerfile.bot
    command: uv run python -m bot.main
    environment:
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - LOG_LEVEL=INFO
      - POISKKINO_API_KEY=${POISKKINO_API_KEY:-}
      - BOT_TOKEN=${BOT_TOKEN:-}
    volumes:
      - ./src:/app/src
    depends_on:
      api:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - semantic-network

volumes:
  qdrant_storage:

networks:
  semantic-network:
    driver: bridge
