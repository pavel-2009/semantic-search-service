version: '3.8'

services:
  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
    volumes:
      - qdrant_storage:/qdrant/storage
    environment:
      - QDRANT_API_KEY=${QDRANT_API_KEY:-}

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    ports:
      - "8000:8000"
    depends_on:
      - qdrant
    environment:
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - LOG_LEVEL=INFO
      - POISKKINO_API_KEY=${POISKKINO_API_KEY}
      - BOT_TOKEN=${BOT_TOKEN}
    volumes:
      - ./src:/app/src

  bot:
    build:
      context: .
      dockerfile: Dockerfile.bot
    depends_on:
      - qdrant
      - api
    environment:
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - LOG_LEVEL=INFO
      - POISKKINO_API_KEY=${POISKKINO_API_KEY}
      - BOT_TOKEN=${BOT_TOKEN}
    volumes:
      - ./src:/app/src

volumes:
  qdrant_storage:
